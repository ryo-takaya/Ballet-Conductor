name: Deploy to Cloudflare Workers

# main に push すると、フロント（静的ファイル）と API を 1 つの Worker としてデプロイする。
# Cloudflare の設定（docs/deploy.md）が終わるまでは、確認（型チェック・テスト・ビルド）だけ行う
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      # フロント：API は同じドメインの /api を呼ぶ
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: /api

      # API：型チェックと Workers 向けのビルド確認
      - run: npm ci
        working-directory: backend
      - run: npm run typecheck
        working-directory: backend
      - run: npx wrangler deploy --dry-run --outdir dist-worker
        working-directory: backend

      # デプロイは main への push で、Cloudflare のキーが登録されているときだけ
      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
        working-directory: backend
